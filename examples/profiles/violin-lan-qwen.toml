# Opt-in profile for Qwen Code CLI and the OpenAI-compatible provider already
# configured in ~/.qwen/settings.json. Credentials stay in Qwen Code's existing
# configuration and are not copied into Violin config or process arguments.

[backend.qwen]
model = "qwen3.8-27b"
auth = "cli"
command = [
  "qwen",
  "--safe-mode",
  "--auth-type", "openai",
  "--model", "{model}",
  "--approval-mode", "{approval_mode}",
  "--max-wall-time", "{timeout}",
  "--output-format", "stream-json",
  "--append-system-prompt",
  "Before acting, read and follow applicable AGENTS.md and CLAUDE.md instructions. In inspect mode, do not modify files. In implement mode, change only the requested scope and report the files changed and checks run. Use only the current workspace.",
]
protocol = "qwen"
idle_timeout_enabled = false
health_command = ["violin-health"]
